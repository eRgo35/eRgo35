<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 300" width="822" height="300" role="img" aria-label="Retro PC boot header for Michał Czyż. EncoreBIOS posts an Encode E35 Cerebrum eight-core processor, counts memory to 32768K, detects the ENCORE-KERNEL and RUST-TOOLS drives and loads encoreldr. The encore operating system splash by encore-industries then appears, its lowercase wordmark striped in the classic six-colour rainbow. Then mike logs in — account created 2017, uptime nine years, 176 repos — and runs tree on his after-hours directory: rust tools ah, ltx, okiro and Server-Manager; kernels encore, LeafOS and TriOS; self-hosted infrastructure on Rocky Linux and Fedora with Docker and his dotfiles; JavaScript projects loom and james plus QNT by day; AI projects granula, anima and nlp-platform; archived work lyra, ti and ascii; and five university publications from 2024 to 2025." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace">
