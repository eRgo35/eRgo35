<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 326" width="822" height="326" role="img" aria-label="Michał Czyż. JavaScript at QNT by day, Rust after hours. MEng, Silesian University of Technology. On GitHub since 2017, 81 public repos." font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace'>
<style>
text{white-space:pre}
.cv{transform:scaleX(0);transform-box:fill-box;transform-origin:100% 50%}
.cur{opacity:0}
@keyframes in{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
@keyframes cover{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes k1{0%{opacity:1;transform:translateX(0)}25.53%{opacity:1;transform:translateX(0);animation-timing-function:steps(6,end)}68.09%,100%{opacity:1;transform:translateX(64.8px)}}</style>
<defs>
<clipPath id="w"><rect x="1" y="1" width="820" height="324" rx="11"/></clipPath>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" opacity="0.016"/></pattern>
</defs>
<g clip-path="url(#w)">
<rect width="822" height="326" fill="#FFFFFF"/>
<rect width="822" height="36" fill="#F6F8FA"/>
<rect y="36" width="822" height="1" fill="#D0D7DE"/>
<circle cx="22" cy="18" r="6" fill="#D63236"/>
<circle cx="42" cy="18" r="6" fill="#E8A317"/>
<circle cx="62" cy="18" r="6" fill="#4FA83A"/>
<text x="411.0" y="22.5" font-size="12" text-anchor="middle" textLength="50.4" lengthAdjust="spacing" ><tspan fill="#59636E">~ — zsh</tspan></text>
<text x="40.0" y="80.0" font-size="18" textLength="21.6" lengthAdjust="spacing" ><tspan fill="#1A7F37">$ </tspan></text>
<text x="61.6" y="80.0" font-size="18" textLength="64.8" lengthAdjust="spacing" ><tspan fill="#1F2328">whoami</tspan></text>
<rect class="cv" x="61.6" y="63.3" width="65.8" height="23.4" fill="#FFFFFF" style="animation:cover 0.33s steps(6,end) 0.30s both"/>
<rect class="cur" x="61.6" y="64.5" width="10.8" height="19.3" fill="#1F2328" style="animation:k1 0.78s linear 0.10s none"/>
<text x="40.0" y="140.0" font-size="46" font-weight="700" textLength="303.6" lengthAdjust="spacing" style="animation:up 0.45s ease-out 0.78s both"><tspan fill="#1F2328">Michał Czyż</tspan></text>
<text x="40.0" y="184.0" font-size="24" textLength="604.8" lengthAdjust="spacing" style="animation:up 0.45s ease-out 0.90s both"><tspan fill="#1F2328">JavaScript @ QNT</tspan><tspan fill="#59636E"> by day · </tspan><tspan fill="#BC4C00">Rust</tspan><tspan fill="#59636E"> after hours</tspan></text>
<text x="40.0" y="222.0" font-size="18" textLength="432.0" lengthAdjust="spacing" style="animation:in 0.40s ease-out 1.08s both"><tspan fill="#59636E">MEng · Silesian University of Technology</tspan></text>
<text x="40.0" y="250.0" font-size="18" textLength="410.4" lengthAdjust="spacing" style="animation:in 0.40s ease-out 1.16s both"><tspan fill="#59636E">on GitHub since 2017 · 81 public repos</tspan></text>
<g style="animation:in .05s linear 1.58s both">
<text x="40.0" y="296.0" font-size="18" textLength="21.6" lengthAdjust="spacing" ><tspan fill="#1A7F37">$ </tspan></text>
<rect x="61.6" y="280.5" width="10.8" height="19.3" fill="#1F2328" style="animation:blink 1.1s steps(1) 0s infinite"/>
</g>
<rect y="37" width="822" height="289" fill="url(#scan)" pointer-events="none"/>
</g>
<rect x="0.5" y="0.5" width="821" height="325" rx="11.5" fill="none" stroke="#D0D7DE"/>
</svg>
