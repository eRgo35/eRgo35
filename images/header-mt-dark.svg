<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 300" width="822" height="300" role="img" aria-label="Terminal session header for Michał Czyż. The prompt runs whoami, printing Michał Czyż, MEng at the Silesian University of Technology; then cat of now.txt, printing: Encore OS, Rust tooling, self-hosted boxes — JavaScript at QNT by day. A machine-translation command then renders three approaches side by side. IBM Model 1: the English tokens good and morning joined by two crossing arcs to the Polish tokens dzień and dobry, with a pulse travelling along each arc, showing the reordering. Seq2Seq: encoder cells filling along a spine, collapsing into a single hidden state, then a decoder unrolling from it. LLMs: a stream of tokens with a fan of attention arcs from every previous token converging on the token being predicted. All three panels finish by producing the same Polish translation, dzień dobry: the alignment model pops it out token by token, the Seq2Seq decoder emits the whole phrase at once, and the language model streams it left to right." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace">
