@keyframes pop{0%{opacity:0;transform:translateY(-22px) scale(.85)}65%{opacity:1;transform:translateY(3px) scale(1.02)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
