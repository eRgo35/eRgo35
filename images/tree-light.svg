<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 362" width="822" height="362" role="img" aria-label="Terminal running tree on ~/after-hours. rust: ah, ltx, okiro, Server-Manager. kernels: encore, LeafOS, TriOS. infra: self-hosted, rocky, fedora, docker, dots. js: loom, james, QNT by day. ai: granula, anima, nlp-platform. univ: 5 publications 2024–25. archive: lyra, ti, ascii. 7 directories, 43 private repos waiting to ship." font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, "JetBrains Mono", "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace'>
<style>
