name: render profile svgs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/**"

jobs:
  render:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate breakout SVGs
        uses: cyprieng/github-breakout@v1.2.4
        with:
          github_username: ${{ github.repository_owner }}

      - name: Skin breakout in Encore chrome
        run: |
          mkdir -p images
          python3 .github/scripts/skin_breakout.py output/dark.svg  images/breakout-dark.svg  dark
          python3 .github/scripts/skin_breakout.py output/light.svg images/breakout-light.svg light
          rm -rf output

      - name: Render header, tree and wave
        env:
          # PAT with read access to all repos (incl. private + org); the
          # default GITHUB_TOKEN cannot see private repos. Without it the
          # render falls back to the last values in stats.json.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 .github/scripts/render.py --github-stats

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/*.svg .github/scripts/stats.json
          git commit -m "chore: render profile svgs" || echo "No changes to commit"
          git push
